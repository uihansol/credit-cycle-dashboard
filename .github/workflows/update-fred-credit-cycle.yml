name: Update FRED data (credit-cycle)

on:
  push:
    branches: [main]
    paths:
      - "credit-cycle/**"
      - ".github/workflows/update-fred-credit-cycle.yml"
  schedule:
    - cron: "15 2 * * 1-5"   # 평일 UTC 02:15 (한국시간 11:15)
  workflow_dispatch:
    inputs:
      full_refresh:
        description: "전체 기간을 다시 다운로드 (기존 CSV 무시)"
        type: boolean
        default: false
      lookback_days:
        description: "증분 업데이트 시 다시 받을 최근 일수"
        default: "120"

permissions:
  contents: write

concurrency:
  group: update-fred-credit-cycle
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create data folder
        run: mkdir -p credit-cycle/data

      - name: Download & merge FRED data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}   # 선택 사항. 없으면 fredgraph.csv 사용
          FULL_REFRESH: ${{ github.event.inputs.full_refresh || 'false' }}
          LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '120' }}
        run: python credit-cycle/scripts/update_fred.py

      - name: Commit & push if changed
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add credit-cycle/data
          if git diff --cached --quiet; then
            echo "변경 사항 없음 — 커밋하지 않습니다."
            exit 0
          fi
          git commit -m "data: update FRED credit-cycle series ($(date -u +%Y-%m-%d))"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
